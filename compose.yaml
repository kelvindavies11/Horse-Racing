services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: horse_racing
      POSTGRES_USER: horse_racing
      POSTGRES_PASSWORD: horse_racing_local
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horse_racing -d horse_racing"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - horse-racing-postgres:/var/lib/postgresql/data

volumes:
  horse-racing-postgres:
